<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICKPICK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jersey+25&family=REM:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="MainPage.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a href="#" class="brand">PICKPICK</a>
        <nav class="site-nav" aria-label="주요 메뉴">
          <a href="#">+ CREATE</a>
          <a href="#">RANKING</a>
          <a href="#">LOG IN</a>
          <a href="#" class="account-link" aria-label="계정">
            <img src="./pickpick/asset/account_circle_48dp.svg" alt="" />
          </a>
        </nav>
      </div>
      <div class="header-glow" aria-hidden="true"></div>
    </header>

    <main class="page-main">
      <section class="hero">
        <h1>결정하기 힘들땐? <span>픽픽!</span></h1>
        <p>
          당신의 소소하지만 끝없는 고민들, 직관적인 투표로 완벽하게 결정해
          드립니다.
        </p>
      </section>

      <section class="vote-section" aria-label="인기 투표">
        <div class="rank-badge">1st</div>

        <article class="vote-card">
          <h2>스텔 사장 결정전</h2>

          <div class="vote-match">
            <a href="#" class="candidate-card" aria-label="사쵸 후보">
              <img src="./pickpick/asset/사쵸.jpg" alt="사쵸" />
              <span class="candidate-name">사쵸</span>
            </a>

            <div class="vs-mark" aria-hidden="true">
              <img src="./pickpick/asset/vs_logo.svg" alt="" />
            </div>

            <a href="#" class="candidate-card" aria-label="외노자 후보">
              <img src="./pickpick/asset/외노자.jpg" alt="외노자" />
              <span class="candidate-name">외노자</span>
            </a>
          </div>
        </article>
      </section>

      <a href="#" class="next-vote">↓ 다음 투표 보러가기</a>
    </main>
  </body>
</html>
