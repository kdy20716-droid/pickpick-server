<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICKPICK - 투표 만들기</title>
    <link rel="stylesheet" href="vote.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <h1 class="logo">PICKPICK</h1>
        <div class="nav-links">
          <a href="#">+ CREATE</a>
          <a href="#">RANKING</a>
          <a href="#">LOG IN</a>
          <div class="user-icon">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08s5.97 1.09 6 3.08c-1.29 1.94-3.5 3.22-6 3.22z"
              />
            </svg>
          </div>
        </div>
      </div>
    </nav>

    <main class="create-container">
      <section class="editor-section">
        <div class="editor-card">
          <input
            type="text"
            class="title-input"
            placeholder="제목을 입력하세요"
          />

          <div class="matchup-editor">
            <div class="upload-box">
              <div class="upload-placeholder">
                <span class="icon-add-image">🖼️+</span>
              </div>
              <input
                type="text"
                class="candidate-name-input"
                placeholder="후보군 이름"
              />
            </div>

            <div class="vs-badge">VS</div>

            <div class="upload-box">
              <div class="upload-placeholder">
                <span class="icon-add-image">🖼️+</span>
              </div>
              <input
                type="text"
                class="candidate-name-input"
                placeholder="후보군 이름"
              />
            </div>
          </div>

          <button class="add-candidate-btn">
            <svg width="30" height="30" viewBox="0 0 24 24">
              <path fill="#ccc" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
          </button>
        </div>
      </section>

      <aside class="settings-section">
        <div class="settings-card">
          <div class="setting-group">
            <h3 class="group-title">후보군 이름</h3>
            <ul class="candidate-list">
              <li>
                <span class="num">1</span>
                <input type="text" placeholder="이름을 입력하세요" />
              </li>
              <li>
                <span class="num">2</span>
                <input type="text" placeholder="이름을 입력하세요" />
              </li>
            </ul>
          </div>

          <div class="setting-group">
            <h3 class="group-title">TAG</h3>
            <div class="tag-cloud">
              <button class="tag">연예</button>
              <button class="tag">음식</button>
              <button class="tag">애니메이션</button>
              <button class="tag">동물</button>
              <button class="tag">스포츠</button>
              <button class="tag">일상</button>
              <button class="tag">게임</button>
              <button class="tag">음악</button>
              <button class="tag active">영화 / 드라마</button>
              <button class="tag">웹툰 / 웹소설</button>
              <button class="tag">유튜버 / 스트리머</button>
              <button class="tag">밸런스 게임</button>
              <button class="tag">밈</button>
              <button class="tag">기타</button>
            </div>
          </div>

          <button class="submit-fab">
            <svg width="24" height="24" viewBox="0 0 24 24">
              <path
                fill="white"
                d="M5 20h14v-2H5v2zm0-10l1.41 1.41L11 6.83V16h2V6.83l4.59 4.58L19 10l-7-7-7 7z"
              />
            </svg>
          </button>
        </div>
      </aside>
    </main>
    <script src="vote.js"></script>
  </body>
</html>
