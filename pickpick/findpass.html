<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비밀번호 찾기 - PICKPICK</title>
    <link rel="stylesheet" href="findpass.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="logo">PICKPICK</h1>
      </header>

      <main class="content-box">
        <div class="find-form-container">
          <h2 class="title">비밀번호 찾기</h2>
          <p class="description">
            가입하신 이메일 주소를 입력해 주세요.<br />
            임시 비밀번호를 발송해 드립니다.
          </p>

          <form id="findPassForm">
            <div class="input-group">
              <input
                type="email"
                id="emailInput"
                placeholder="이메일 주소 입력"
                required
              />
            </div>

            <div class="button-group">
              <button type="button" class="btn-back" onclick="history.back()">
                뒤로 가기
              </button>
              <button type="submit" class="btn-submit">
                임시 비밀번호 발송
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
    <script src="findpass.js"></script>
  </body>
</html>
