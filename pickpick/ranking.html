<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICKPICK - 실시간 랭킹</title>
    <link rel="stylesheet" href="ranking.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <h1 class="logo">PICKPICK</h1>
        <div class="nav-links">
          <a href="#">+ CREATE</a>
          <a href="#">RANKING</a>
          <a href="#">LOG IN</a>
          <div class="user-icon">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08s5.97 1.09 6 3.08c-1.29 1.94-3.5 3.22-6 3.22z"
              />
            </svg>
          </div>
        </div>
      </div>
    </nav>

    <main class="ranking-content">
      <section class="top-ranking-area">
        <div class="top-card rank-2">
          <div class="medal silver">2</div>
          <div class="preview-box">
            <img src="asset/사쵸.jpg" alt="candidate1" class="img-top" />
            <div class="vs-mini">vs</div>
            <img src="asset/외노자.jpg" alt="candidate2" class="img-bottom" />
          </div>
        </div>

        <div class="top-card rank-1">
          <div class="medal gold">1</div>
          <div class="preview-box">
            <img src="asset/사쵸.jpg" alt="candidate1" class="img-top" />
            <div class="vs-mini">vs</div>
            <img src="asset/외노자.jpg" alt="candidate2" class="img-bottom" />
          </div>
        </div>

        <div class="top-card rank-3">
          <div class="medal bronze">3</div>
          <div class="preview-box">
            <img src="asset/사쵸.jpg" alt="candidate1" class="img-top" />
            <div class="vs-mini">vs</div>
            <img src="asset/외노자.jpg" alt="candidate2" class="img-bottom" />
          </div>
        </div>
      </section>

      <section class="ranking-list-area">
        <div class="rank-item">
          <div class="rank-number">4</div>
          <div class="rank-images">
            <img src="sacho.jpg" alt="c1" />
            <span class="vs-text">VS</span>
            <img src="asset/외노자.jpg" alt="c2" />
          </div>
          <div class="rank-title">투표 제목이 들어갑니다</div>
        </div>

        <div class="rank-item1">
          <div class="rank-number">5</div>
          <div class="rank-images">
            <img src="asset/외노자.jpg" alt="c1" />
            <span class="vs-text">VS</span>
            <img src="sacho.jpg" alt="c2" />
          </div>
          <div class="rank-title">투표 제목이 들어갑니다</div>
        </div>

        <div class="rank-item">
          <div class="rank-number">6</div>
          <div class="rank-images">
            <img src="sacho.jpg" alt="c1" />
            <span class="vs-text">VS</span>
            <img src="enojas.png" alt="c2" />
          </div>
          <div class="rank-title">투표 제목이 들어갑니다</div>
        </div>
      </section>
    </main>
  </body>
</html>
