<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICKPICK - 결정하기 힘들땐? 픽픽!</title>
    <link rel="stylesheet" href="pickpick.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <h1 class="logo">PICKPICK</h1>
        <div class="nav-links">
          <a href="#">+ CREATE</a>
          <a href="#">RANKING</a>
          <a href="#">LOG IN</a>
          <div class="user-icon">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08s5.97 1.09 6 3.08c-1.29 1.94-3.5 3.22-6 3.22z"
              />
            </svg>
          </div>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <header class="hero-section">
        <h2 class="hero-title">
          결정하기 힘들땐? <span class="highlight">픽픽!</span>
        </h2>
        <p class="hero-subtitle">
          당신의 소소하지만 끝없는 고민들, 직관적인 투표로 완벽하게 결정해
          드립니다.
        </p>
      </header>

      <section class="vote-container">
        <div class="badge-1st">1st</div>

        <div class="vote-card">
          <h3 class="vote-title">스텔 사장 결정전</h3>

          <div class="vote-matchup">
            <div class="candidate-box">
              <div class="image-wrapper">
                <img src="asset/사쵸.jpg" alt="사쵸" />
                <div class="name-tag">사쵸</div>
              </div>
            </div>

            <div class="vs-badge">VS</div>

            <div class="candidate-box">
              <div class="image-wrapper">
                <img src="asset/외노자.jpg" alt="외노자" />
                <div class="name-tag">외노자</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <footer class="more-link">
        <a href="#">↓ 더 많은 투표 보러가기</a>
      </footer>
    </main>
  </body>
</html>
